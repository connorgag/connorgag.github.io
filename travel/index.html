        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
        
        .event-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }
        
        .event-card:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.25);
        }

        /* Grouping Styles */
        .group-container {
            border-left: 2px solid rgba(96, 165, 250, 0.3);
            margin-left: 0.5rem;
            padding-left: 1rem;
            display: none;
            flex-direction: column;
            gap: 0.5rem;
        }

        .group-container.expanded {
            display: flex;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chevron { transition: transform 0.3s ease; }
        .expanded-header .chevron { transform: rotate(180deg); }

        #modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 55%; 
            transform: translate(-50%, -50%);
            z-index: 1000;
            width: 500px;
            max-width: 90vw;
        }

        #overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            z-index: 999;
        }

        .glow-text {
            text-shadow: 0 0 15px rgba(96, 165, 250, 0.8);
        }

        /* Gallery Styles */
        .gallery-container {
            width: 100%;
            height: 300px;
            overflow: hidden;
            position: relative;
        }
        .gallery-track {
            display: flex;
            height: 100%;
            transition: transform 0.5s ease-in-out;
        }
        .gallery-slide {
            min-width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
        }
        .gallery-nav {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 20;
        }
        .nav-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            cursor: pointer;
            transition: background 0.3s;
        }
        .nav-dot.active {
            background: white;
            width: 20px;
            border-radius: 10px;
        }
        .gallery-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.3);
            color: white;
            padding: 10px;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
            z-index: 20;
        }
        .gallery-arrow:hover { background: rgba(0,0,0,0.6); }
        .arrow-left { left: 10px; }
        .arrow-right { right: 10px; }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a1128); 
            
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.z = 400;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.rotateSpeed = 0.5;
            controls.minDistance = 250;
            controls.maxDistance = 600;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.4;

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);
            
            const pointLight = new THREE.PointLight(0xffffff, 1.5);
            pointLight.position.set(500, 300, 300);
            scene.add(pointLight);

            const loader = new THREE.TextureLoader();
            const earthTexture = loader.load('https://unpkg.com/three-globe/example/img/earth-night.jpg');
            const bumpMap = loader.load('https://unpkg.com/three-globe/example/img/earth-topology.png');

            const globeGeo = new THREE.SphereGeometry(100, 64, 64);
            const globeMat = new THREE.MeshPhongMaterial({
                map: earthTexture,
                bumpMap: bumpMap,
                bumpScale: 2.5,
                specular: new THREE.Color(0x333333),
                shininess: 10
            });
            globe = new THREE.Mesh(globeGeo, globeMat);
            scene.add(globe);

            const starsGeo = new THREE.BufferGeometry();
            const starsPos = [];
            for(let i=0; i<6000; i++) { 
                starsPos.push((Math.random()-0.5)*2000, (Math.random()-0.5)*2000, (Math.random()-0.5)*2000);
            }
            starsGeo.setAttribute('position', new THREE.Float32BufferAttribute(starsPos, 3));
            const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.1, transparent: true, opacity: 0.9 });
            scene.add(new THREE.Points(starsGeo, starsMat));

            createBeamsAndSidebar();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('click', onDocumentMouseDown);
            animate();
        }

        function latLngToVector3(lat, lng, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lng + 180) * (Math.PI / 180);
            return new THREE.Vector3(
                -radius * Math.sin(phi) * Math.cos(theta),
                radius * Math.cos(phi),
                radius * Math.sin(phi) * Math.sin(theta)
            );
        }

        function addGlobeMarker(data) {
            const pos = latLngToVector3(data.lat, data.lng, 100);
            const beamHeight = 45;
            const beamGeo = new THREE.CylinderGeometry(0.8, 0.1, beamHeight, 12, 1, true);
            const beamMat = new THREE.MeshBasicMaterial({
                color: new THREE.Color(data.color),
                transparent: true,
                opacity: 0.7,
                side: THREE.DoubleSide,
                blending: THREE.AdditiveBlending
            });
            const beam = new THREE.Mesh(beamGeo, beamMat);
            const beamPos = latLngToVector3(data.lat, data.lng, 100 + beamHeight/2);
            beam.position.copy(beamPos);
            beam.lookAt(new THREE.Vector3(0,0,0));
            beam.rotateX(Math.PI / 2);
            beam.userData = { eventData: data };
            scene.add(beam);
            beams.push(beam);

            const rippleGeo = new THREE.RingGeometry(1, 1.4, 32);
            const rippleMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(data.color), transparent: true, opacity: 0.9, side: THREE.DoubleSide });
            const ripple = new THREE.Mesh(rippleGeo, rippleMat);
            ripple.position.copy(pos.clone().multiplyScalar(1.01));
            ripple.lookAt(new THREE.Vector3(0,0,0));
            scene.add(ripple);
            ripples.push({ mesh: ripple, scale: 1, opacity: 0.9 });
        }

        function createEventCard(event, isSub = false) {
            const card = document.createElement('div');
            card.className = `event-card p-5 rounded-2xl cursor-pointer ${isSub ? 'mb-0' : ''}`;
            
            // Logic to handle empty title
            const displayTitle = event.title || event.location;
            const displayLoc = event.title ? event.location : "";

            card.innerHTML = `
                <div class="flex justify-between items-center mb-2">
                    <span class="text-[9px] font-extrabold uppercase tracking-widest text-blue-300">${event.tag || 'ENTRY'}</span>
                    <span class="text-[10px] text-gray-400 font-mono">${event.date}</span>
                </div>
                <div class="text-sm font-bold text-white">${displayTitle}</div>
                ${displayLoc ? `<div class="text-[11px] text-gray-400 mt-1">${displayLoc}</div>` : ''}
            `;
            card.onclick = (e) => {
                e.stopPropagation();
                focusOn(event);
            }
            return card;
        }

                        <div>
                            <div class="text-[9px] font-extrabold uppercase tracking-widest text-blue-400 mb-1">TRIP FOLDER</div>
                            <div class="text-sm font-bold text-white">${item.title}</div>
                            <div class="text-[10px] text-gray-400 mt-0.5">${item.date} • ${item.subEvents.length} Stops</div>
                        </div>
                        <svg class="chevron w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    `;

                    const subContainer = document.createElement('div');
                    subContainer.className = "group-container";

                    header.onclick = () => {
                        subContainer.classList.toggle('expanded');
                        header.classList.toggle('expanded-header');
                    };

                    item.subEvents.forEach(sub => {
                        subContainer.appendChild(createEventCard(sub, true));
                        addGlobeMarker(sub);
                    });

                    wrapper.appendChild(header);
                    wrapper.appendChild(subContainer);
                    list.appendChild(wrapper);
                } else {
                    list.appendChild(createEventCard(item));
                    addGlobeMarker(item);
                }
            });
        }

        function focusOn(event) {
            controls.autoRotate = false;
            const targetPos = latLngToVector3(event.lat, event.lng, 280);
            gsap.to(camera.position, {
                x: targetPos.x, y: targetPos.y, z: targetPos.z,
                duration: 2, ease: "power3.inOut",
                onUpdate: () => controls.update(),
                onComplete: () => showModal(event)
            });
        }

        function showModal(event) {
            currentEvent = event;
            galleryIndex = 0;
            
            // Logic to handle empty title in Modal
            document.getElementById('modalTitle').innerText = event.title || event.location;
            document.getElementById('modalLoc').innerText = event.title ? event.location : "";
            document.getElementById('modalTag').innerText = event.tag || 'ENTRY';
            
            const track = document.getElementById('galleryTrack');
            const dots = document.getElementById('galleryDots');
            track.innerHTML = '';
            dots.innerHTML = '';
            
            if (event.images && event.images.length > 0) {
                event.images.forEach((img, idx) => {
                    const slide = document.createElement('div');
                    slide.className = 'gallery-slide';
                    slide.style.backgroundImage = `url('${img}'), url('${fallbackImage}')`;
                    track.appendChild(slide);
                    
                    const dot = document.createElement('div');
                    dot.className = `nav-dot ${idx === 0 ? 'active' : ''}`;
                    dot.onclick = () => setGalleryIndex(idx);
                    dots.appendChild(dot);
                });
            }
            
            updateGalleryUI();
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('modal').style.display = 'block';
        }

        window.moveGallery = function(dir) {
            if (!currentEvent || !currentEvent.images) return;
            galleryIndex += dir;
            if (galleryIndex < 0) galleryIndex = currentEvent.images.length - 1;
            if (galleryIndex >= currentEvent.images.length) galleryIndex = 0;
            updateGalleryUI();
        }

        function setGalleryIndex(idx) {
            galleryIndex = idx;
            updateGalleryUI();
        }

        function updateGalleryUI() {
            const track = document.getElementById('galleryTrack');
            const dots = document.querySelectorAll('.nav-dot');
            if (track) track.style.transform = `translateX(-${galleryIndex * 100}%)`;
            dots.forEach((dot, idx) => {
                if (idx === galleryIndex) dot.classList.add('active');
                else dot.classList.remove('active');
            });
            const arrows = document.querySelectorAll('.gallery-arrow');
            const display = (currentEvent?.images?.length > 1) ? 'flex' : 'none';
            arrows.forEach(a => a.style.display = display);
        }

        window.closeModal = function() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('modal').style.display = 'none';
            controls.autoRotate = true;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onDocumentMouseDown(event) {
            if (event.target.closest('.sidebar') || event.target.closest('#modal')) return;
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(beams);
            if (intersects.length > 0) focusOn(intersects[0].object.userData.eventData);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            ripples.forEach(r => {
                r.scale += 0.02; r.opacity -= 0.012; 
                if (r.opacity <= 0) { r.scale = 1; r.opacity = 0.9; }
                r.mesh.scale.set(r.scale, r.scale, 1);
                r.mesh.material.opacity = r.opacity;
            });
            beams.forEach((b, i) => {
                const s = 1 + Math.sin(Date.now() * 0.002 + i) * 0.15;
                b.scale.set(s, 1, s);
            });
            renderer.render(scene, camera);
        }

        init();
        document.getElementById('overlay').onclick = closeModal;
    </script>
</body>
</html>
