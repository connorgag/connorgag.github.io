        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        /* Updated base background color to a slightly brighter deep navy */
        body { 
            margin: 0; 
            background-color: #050a1f; 
            color: white; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            overflow: hidden; 
        }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; outline: none; }
        
        /* Glassmorphism Sidebar */
        .sidebar {
            background: rgba(8, 12, 28, 0.6);
            backdrop-filter: blur(20px) saturate(180%);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 3px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
        
        .event-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }
        
        .event-card:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        #modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 55%; 
            transform: translate(-50%, -50%);
            z-index: 1000;
            width: 440px;
            max-width: 90vw;
        }

        #overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);

        .glow-text {

        let scene, camera, renderer, controls, globe, raycaster, mouse;
        const beams = [];
        const ripples = [];

        function init() {
            scene = new THREE.Scene();
            // Lighter Midnight Blue Background
            scene.background = new THREE.Color(0x0a1128); 
            
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.z = 400;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.rotateSpeed = 0.5;
            controls.minDistance = 250;
            controls.maxDistance = 600;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.4;

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Brightened Lighting for more pop
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);
            
            const pointLight = new THREE.PointLight(0xffffff, 1.5);
            pointLight.position.set(500, 300, 300);
            scene.add(pointLight);

            const loader = new THREE.TextureLoader();
            const earthTexture = loader.load('https://unpkg.com/three-globe/example/img/earth-night.jpg');
            const bumpMap = loader.load('https://unpkg.com/three-globe/example/img/earth-topology.png');

            const globeGeo = new THREE.SphereGeometry(100, 64, 64);
            const globeMat = new THREE.MeshPhongMaterial({
                map: earthTexture,
                bumpMap: bumpMap,
                bumpScale: 2.5,
                specular: new THREE.Color(0x333333),
                shininess: 10
            });
            globe = new THREE.Mesh(globeGeo, globeMat);
            scene.add(globe);

            // Brighter and denser Starfield
            const starsGeo = new THREE.BufferGeometry();
            const starsPos = [];
            for(let i=0; i<6000; i++) { 
                starsPos.push((Math.random()-0.5)*2000, (Math.random()-0.5)*2000, (Math.random()-0.5)*2000);
            }
            starsGeo.setAttribute('position', new THREE.Float32BufferAttribute(starsPos, 3));
            const starsMat = new THREE.PointsMaterial({ 
                color: 0xffffff, 
                size: 1.1, 
                transparent: true, 
                opacity: 0.9 
            });
            const stars = new THREE.Points(starsGeo, starsMat);
            scene.add(stars);

            createBeams();
            createSidebar();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('click', onDocumentMouseDown);
            animate();
        }

        function latLngToVector3(lat, lng, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lng + 180) * (Math.PI / 180);
            return new THREE.Vector3(
                -radius * Math.sin(phi) * Math.cos(theta),
                radius * Math.cos(phi),
                radius * Math.sin(phi) * Math.sin(theta)
            );
        }

        function createBeams() {
            travelData.forEach(data => {
                const pos = latLngToVector3(data.lat, data.lng, 100);
                
                const beamHeight = 45;
                const beamGeo = new THREE.CylinderGeometry(1.0, 0.1, beamHeight, 12, 1, true);
                const beamMat = new THREE.MeshBasicMaterial({
                    color: new THREE.Color(data.color),
                    transparent: true,
                    opacity: 0.7,
                    side: THREE.DoubleSide,
                    blending: THREE.AdditiveBlending
                });
                const beam = new THREE.Mesh(beamGeo, beamMat);
                
                const beamPos = latLngToVector3(data.lat, data.lng, 100 + beamHeight/2);
                beam.position.copy(beamPos);
                beam.lookAt(new THREE.Vector3(0,0,0));
                beam.rotateX(Math.PI / 2);
                
                beam.userData = { eventData: data };
                scene.add(beam);
                beams.push(beam);

                const rippleGeo = new THREE.RingGeometry(1, 1.4, 32);
                const rippleMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(data.color), transparent: true, opacity: 0.9, side: THREE.DoubleSide });
                const ripple = new THREE.Mesh(rippleGeo, rippleMat);
                ripple.position.copy(pos.clone().multiplyScalar(1.01));
                ripple.lookAt(new THREE.Vector3(0,0,0));
                scene.add(ripple);
                ripples.push({ mesh: ripple, scale: 1, opacity: 0.9 });
            });
        }

        function createSidebar() {
            const list = document.getElementById('eventList');
            travelData.forEach(event => {
                const card = document.createElement('div');
                card.className = "event-card p-5 rounded-2xl cursor-pointer";
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-[9px] font-extrabold uppercase tracking-widest text-blue-300">${event.tag || 'ENTRY'}</span>
                        <span class="text-[10px] text-gray-400 font-mono">${event.date}</span>
                    </div>
                    <div class="text-sm font-bold text-white">${event.title}</div>
                    <div class="text-[11px] text-gray-400 mt-1">${event.location}</div>
                `;
                card.onclick = () => focusOn(event);
                list.appendChild(card);
            });
        }

        function focusOn(event) {
            controls.autoRotate = false;
            const targetPos = latLngToVector3(event.lat, event.lng, 280);
            
            gsap.to(camera.position, {
                x: targetPos.x,
                y: targetPos.y,
                z: targetPos.z,
                duration: 2,
                ease: "power3.inOut",
                onUpdate: () => controls.update(),
                onComplete: () => showModal(event)
            });
        }

        function showModal(event) {
            document.getElementById('modalTitle').innerText = event.title;
            document.getElementById('modalLoc').innerText = event.location;
            document.getElementById('modalDesc').innerText = event.desc || "Exploring the journey...";
            document.getElementById('modalTag').innerText = event.tag || 'ENTRY';
            document.getElementById('modalImg').style.backgroundImage = `url('${event.img}')`;
            
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('modal').style.display = 'block';
        }

        window.closeModal = function() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('modal').style.display = 'none';
            controls.autoRotate = true;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onDocumentMouseDown(event) {
            if (event.target.closest('.sidebar') || event.target.closest('#modal')) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(beams);
            if (intersects.length > 0) {
                focusOn(intersects[0].object.userData.eventData);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            ripples.forEach(r => {
                r.scale += 0.02;
                r.opacity -= 0.012; 
                if (r.opacity <= 0) {
                    r.scale = 1;
                    r.opacity = 0.9;
                }
                r.mesh.scale.set(r.scale, r.scale, 1);
                r.mesh.material.opacity = r.opacity;
            });

            beams.forEach((b, i) => {
                const s = 1 + Math.sin(Date.now() * 0.002 + i) * 0.15;
                b.scale.set(s, 1, s);
            });

            renderer.render(scene, camera);
        }

        init();
        document.getElementById('overlay').onclick = closeModal;
    </script>
